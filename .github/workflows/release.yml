name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Windows x64
        run: go build -o dist/orpanel-win32-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: dist/orpanel-win32-x64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build macOS arm64
        run: CGO_ENABLED=1 go build -o dist/orpanel-darwin-arm64
      - name: Build macOS x64
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o dist/orpanel-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            dist/orpanel-darwin-arm64
            dist/orpanel-darwin-x64

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/orpanel-win32-x64.exe
            dist/orpanel-darwin-arm64
            dist/orpanel-darwin-x64
          fail_on_unmatched_files: false
