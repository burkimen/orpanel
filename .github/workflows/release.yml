name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Windows ARM64 link guard
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -o NUL .

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Set version from tag
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build Windows x64
        shell: bash
        run: VERSION=$(cat version.txt) && go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-win32-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: dist/orpanel-win32-x64.exe

  # NOTE: windows/arm64 cross-compile below is unverified on CI until the
  # first tag run or manual workflow_dispatch run; local GOOS/GOARCH probe only.
  build-windows-arm64:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Set version from tag
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build Windows arm64
        shell: bash
        run: VERSION=$(cat version.txt) && GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-win32-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: win32-arm64
          path: dist/orpanel-win32-arm64.exe

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev
      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build Linux x64
        run: |
          VERSION=$(cat version.txt)
          CGO_ENABLED=1 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/orpanel-linux-x64

  # NOTE: ubuntu-24.04-arm runner below is unverified on CI until the first
  # tag run or manual workflow_dispatch run; cannot be checked from x64 Windows.
  build-linux-arm64:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev
      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build Linux arm64
        run: |
          VERSION=$(cat version.txt)
          CGO_ENABLED=1 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/orpanel-linux-arm64

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build macOS arm64
        run: |
          VERSION=$(cat version.txt)
          CGO_ENABLED=1 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-darwin-arm64
      - name: Build macOS x64
        run: |
          VERSION=$(cat version.txt)
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            dist/orpanel-darwin-arm64
            dist/orpanel-darwin-x64

  # Release only runs for v* tags; a manual workflow_dispatch from a branch
  # runs test + build jobs and skips this job (github.ref is refs/heads/...).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-windows-arm64, build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt

      # Release binaries (single source of truth — keep all three lists in sync):
      # orpanel-win32-x64.exe, orpanel-win32-arm64.exe, orpanel-linux-x64,
      # orpanel-linux-arm64, orpanel-darwin-arm64, orpanel-darwin-x64
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum orpanel-win32-x64.exe orpanel-win32-arm64.exe orpanel-linux-x64 orpanel-linux-arm64 orpanel-darwin-arm64 orpanel-darwin-x64 > sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Publish release (retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for f in orpanel-win32-x64.exe orpanel-win32-arm64.exe orpanel-linux-x64 orpanel-linux-arm64 orpanel-darwin-arm64 orpanel-darwin-x64 sha256sums.txt version.txt; do
            if [ "$f" = "version.txt" ]; then p="$f"; else p="dist/$f"; fi
            if [ ! -f "$p" ]; then echo "missing expected file: $p" >&2; exit 1; fi
          done
          attempt=1
          while [ $attempt -le 3 ]; do
            echo "publish attempt $attempt/3"
            if gh release view "$TAG" >/dev/null 2>&1; then
              CMD="upload"
            else
              CMD="create"
            fi
            if [ "$CMD" = "create" ]; then
              if gh release create "$TAG" dist/orpanel-win32-x64.exe dist/orpanel-win32-arm64.exe dist/orpanel-linux-x64 dist/orpanel-linux-arm64 dist/orpanel-darwin-arm64 dist/orpanel-darwin-x64 dist/sha256sums.txt version.txt --title "$TAG" --notes ""; then break; fi
            else
              if gh release upload "$TAG" dist/orpanel-win32-x64.exe dist/orpanel-win32-arm64.exe dist/orpanel-linux-x64 dist/orpanel-linux-arm64 dist/orpanel-darwin-arm64 dist/orpanel-darwin-x64 dist/sha256sums.txt version.txt --clobber; then break; fi
            fi
            echo "publish attempt $attempt failed; retrying in 15s" >&2
            attempt=$((attempt + 1))
            if [ $attempt -le 3 ]; then sleep 15; fi
          done
          if [ $attempt -gt 3 ]; then echo "publish failed after 3 attempts" >&2; exit 1; fi
          gh release edit "$TAG" --draft=false --latest
          STATE="$(gh release view "$TAG" --json isDraft,assets --jq '{draft: .isDraft, n: (.assets | length), names: (.assets | map(.name) | sort)}')"
          echo "post-publish state: $STATE"
          DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$DRAFT" != "false" ]; then echo "release $TAG still draft" >&2; exit 1; fi
          if [ "$COUNT" != "8" ]; then echo "release $TAG has $COUNT assets, want 8" >&2; exit 1; fi
