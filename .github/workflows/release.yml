name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Set version from tag
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build Windows x64
        shell: bash
        run: VERSION=$(cat version.txt) && go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-win32-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: dist/orpanel-win32-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev
      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build Linux x64
        run: |
          VERSION=$(cat version.txt)
          CGO_ENABLED=1 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/orpanel-linux-x64

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt
      - name: Build macOS arm64
        run: |
          VERSION=$(cat version.txt)
          CGO_ENABLED=1 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-darwin-arm64
      - name: Build macOS x64
        run: |
          VERSION=$(cat version.txt)
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.AppVersion=$VERSION" -o dist/orpanel-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            dist/orpanel-darwin-arm64
            dist/orpanel-darwin-x64

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/orpanel-win32-x64.exe
            dist/orpanel-linux-x64
            dist/orpanel-darwin-arm64
            dist/orpanel-darwin-x64
            version.txt
          fail_on_unmatched_files: false
