name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Windows x64
        run: go build -ldflags "-H=windowsgui" -o dist/orpanel-win32-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: dist/orpanel-win32-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install GTK dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev
      - name: Build Linux x64
        run: CGO_ENABLED=1 go build -o dist/orpanel-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/orpanel-linux-x64

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install ARM64 cross-compiler + GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libgtk-3-dev:arm64 libappindicator3-dev:arm64
      - name: Build Linux arm64
        run: |
          export CC=aarch64-linux-gnu-gcc
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -o dist/orpanel-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/orpanel-linux-arm64

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build macOS arm64
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o dist/orpanel-darwin-arm64
      - name: Build macOS x64
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o dist/orpanel-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            dist/orpanel-darwin-arm64
            dist/orpanel-darwin-x64

  release:
    needs: [build-windows, build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/orpanel-win32-x64.exe
            dist/orpanel-linux-x64
            dist/orpanel-linux-arm64
            dist/orpanel-darwin-arm64
            dist/orpanel-darwin-x64
          fail_on_unmatched_files: false
